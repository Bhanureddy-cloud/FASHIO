spring.application.name=fashio-backend

# Database (environment variables override these when deployed)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fashio_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}
server.error.include-message=always

# JWT
jwt.secret=${JWT_SECRET:change-this-secret-in-production-it-must-be-32-chars-or-more}
jwt.expiration-ms=86400000

# Allowed frontend URLs for CORS (comma separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Password of the admin account created on first start
app.admin.password=${ADMIN_PASSWORD:admin123}

# Local-only overrides. This file is NOT committed to git.
spring.config.import=optional:classpath:secrets.properties